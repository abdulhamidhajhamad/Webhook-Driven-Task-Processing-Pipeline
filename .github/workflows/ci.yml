name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check & Build
        run: npm run build

      - name: Run Unit Tests
        run: npm run test

  docker-check:
    runs-on: ubuntu-latest
    needs: build-and-test 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create fully functional .env file from Secrets
        run: |
          touch .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}" >> .env
          echo "NODE_ENV=test" >> .env
          echo "PORT=3001" >> .env

      - name: Verify Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Test Infrastructure (Postgres, RabbitMQ, API, Workers)
        run: |
          docker compose up -d
          # Wait for services to initialize
          sleep 15
          
          echo "--- Container Status ---"
          docker ps -a
          
          # Check for any crashed containers
          CRASHED=$(docker ps -a --filter "status=exited" -q)
          if [ ! -z "$CRASHED" ]; then
            echo "Error: The following containers crashed:"
            docker ps -a --filter "status=exited"
            echo "--- Container Logs ---"
            docker compose logs
            exit 1
          fi

      - name: Fetch Container Logs
        if: always()
        run: |
          docker compose logs api
          docker compose logs worker-main
          docker compose logs worker-retry
          docker compose logs worker-sweep
      
      - name: Teardown
        if: always()
        run: docker compose down -v
